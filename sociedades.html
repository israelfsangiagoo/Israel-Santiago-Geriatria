<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Israel Santiago | Sociedades</title>
<meta name="description" content="Sociedades de Israel Santiago.">
<style>img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">

<style>
/* ============================================================
   Israel Santiago · sociedades
   Mesma paleta e tipografia do site principal
   ============================================================ */

:root{
  --bg:#F4F3EE;--bg-2:#FAF9F5;--surface:#FFFFFF;
  --ink:#14181A;--ink-2:#39403C;--muted:#767C76;--faint:#9BA09A;
  --line:#DFDDD3;--line-soft:#EAE8E0;
  --accent:#123A2D;--accent-2:#1E6349;--accent-wash:#E6EBE5;
  --gold:#94764B;--gold-wash:#EFE6D6;
  --btn-bg:#123A2D;--btn-fg:#F7F6F1;
  --shadow:0 1px 2px rgba(20,24,26,.04), 0 14px 34px -20px rgba(18,58,45,.26);
  --shadow-lift:0 2px 4px rgba(20,24,26,.05), 0 22px 44px -22px rgba(18,58,45,.34);
  --focus:#1E6349;
  --f:"Helvetica Neue","Inter",Helvetica,Arial,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C100E;--bg-2:#111614;--surface:#151A18;--ink:#ECEEE9;--ink-2:#C2C8C2;
    --muted:#8B928B;--faint:#6C736D;--line:#242A27;--line-soft:#1C211E;
    --accent:#7FC1A2;--accent-2:#5AA684;--accent-wash:#16211C;--gold:#C6A579;--gold-wash:#241F16;
    --btn-bg:#4E9878;--btn-fg:#06100B;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 18px 44px -24px rgba(0,0,0,.9);
    --shadow-lift:0 2px 6px rgba(0,0,0,.5), 0 26px 54px -24px rgba(0,0,0,1);
    --focus:#7FC1A2;
  }
}
:root[data-theme="dark"]{
  --bg:#0C100E;--bg-2:#111614;--surface:#151A18;--ink:#ECEEE9;--ink-2:#C2C8C2;
  --muted:#8B928B;--faint:#6C736D;--line:#242A27;--line-soft:#1C211E;
  --accent:#7FC1A2;--accent-2:#5AA684;--accent-wash:#16211C;--gold:#C6A579;--gold-wash:#241F16;
  --btn-bg:#4E9878;--btn-fg:#06100B;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 18px 44px -24px rgba(0,0,0,.9);
  --shadow-lift:0 2px 6px rgba(0,0,0,.5), 0 26px 54px -24px rgba(0,0,0,1);
  --focus:#7FC1A2;
}

*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--f);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  padding:clamp(24px,5vw,44px) 20px clamp(40px,7vw,72px);
  min-height:100vh;position:relative;isolation:isolate;
}
::selection{background:var(--accent-wash);color:var(--ink)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:6px}

.amb{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.amb::before{
  content:"";position:absolute;width:64vmax;height:64vmax;left:-26vmax;top:-30vmax;border-radius:50%;
  background:radial-gradient(circle at 50% 50%, var(--accent-wash) 0%, transparent 66%);
  filter:blur(70px);opacity:.85;animation:drift 30s ease-in-out infinite alternate;
}
.amb::after{
  content:"";position:absolute;width:46vmax;height:46vmax;right:-18vmax;top:14vmax;border-radius:50%;
  background:radial-gradient(circle at 50% 50%, var(--gold-wash) 0%, transparent 68%);
  filter:blur(70px);opacity:.7;animation:drift2 36s ease-in-out infinite alternate;
}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(5%,4%,0) scale(1.1)}}
@keyframes drift2{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-5%,-3%,0) scale(1.08)}}

.col{width:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column}

/* ---------- topo ---------- */
.back{
  display:inline-flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink-2);
  border:1px solid var(--line);border-radius:999px;padding:9px 16px;width:max-content;
  background:color-mix(in srgb, var(--surface) 70%, transparent);
  transition:border-color .3s ease,color .3s ease,background .3s ease;
}
.back:hover{border-color:var(--accent-2);color:var(--ink);background:var(--surface)}
.back span{transition:transform .4s cubic-bezier(.22,.68,.24,1);display:inline-block}
.back:hover span{transform:translateX(-3px)}

.eyebrow{
  display:flex;align-items:center;gap:12px;margin-top:clamp(38px,6vw,58px);
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
}
.eyebrow::before{content:"";width:22px;height:1px;background:var(--gold);flex:none}
h1{
  margin:18px 0 0;font-size:clamp(32px,6.5vw,52px);font-weight:500;
  letter-spacing:-.04em;line-height:1.03;text-wrap:balance;
}
.intro{margin:22px 0 0;font-size:clamp(16px,2vw,18px);color:var(--ink-2);max-width:56ch;line-height:1.65}

/* ---------- lista ---------- */
.list{display:flex;flex-direction:column;gap:16px;margin-top:clamp(38px,6vw,58px)}
.soc{
  position:relative;isolation:isolate;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:clamp(20px,3vw,28px);box-shadow:var(--shadow);
  display:grid;grid-template-columns:64px minmax(0,1fr);gap:clamp(16px,2.5vw,24px);
  transition:transform .45s cubic-bezier(.22,.68,.24,1), box-shadow .45s ease, border-color .35s ease;
}
.soc::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent-2);
  transform:scaleY(0);transform-origin:top;transition:transform .55s cubic-bezier(.22,.68,.24,1);
}
.soc:hover{transform:translateY(-4px);box-shadow:var(--shadow-lift);border-color:var(--accent-2)}
.soc:hover::before{transform:scaleY(1)}

.mark{
  width:64px;height:64px;border-radius:14px;overflow:hidden;flex:none;
  border:1px solid var(--line-soft);
  background:linear-gradient(145deg,var(--accent-wash),var(--bg-2) 60%,var(--gold-wash));
  display:grid;place-items:center;position:relative;
}
.mark img{width:100%;height:100%;object-fit:cover;display:block}
.mark .letra{font-size:22px;font-weight:600;letter-spacing:-.03em;color:var(--accent)}
.mark:has(img) .letra{display:none}

.corpo{min-width:0;display:flex;flex-direction:column;gap:12px}
.linha1{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 14px}
.nome{margin:0;font-size:clamp(19px,2.4vw,24px);font-weight:500;letter-spacing:-.025em;line-height:1.2}
.papel{
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-2);
  border:1px solid var(--accent-2);border-radius:999px;padding:4px 10px;white-space:nowrap;
}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:var(--bg-2);
}
.desc{margin:0;font-size:15px;color:var(--muted);line-height:1.65;max-width:56ch}
.acao{
  display:inline-flex;align-items:center;gap:9px;width:max-content;margin-top:2px;
  font-size:13.5px;color:var(--accent-2);border-bottom:1px solid var(--line);
  padding-bottom:3px;transition:border-color .3s ease;
}
.acao:hover{border-color:var(--accent-2)}
.acao span{display:inline-block;transition:transform .4s cubic-bezier(.22,.68,.24,1)}
.acao:hover span{transform:translateX(3px)}

/* aviso de esboço, apague depois de preencher */
.nota{
  margin-top:clamp(34px,5vw,48px);border:1px dashed var(--line);border-radius:12px;
  padding:18px 20px;background:transparent;
}
.nota b{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:500;margin-bottom:8px}
.nota p{margin:0;font-size:14px;color:var(--muted);line-height:1.6}

/* ---------- rodapé ---------- */
.foot{
  margin-top:clamp(44px,7vw,72px);padding-top:26px;border-top:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;
}
.foot .n{font-size:16px;font-weight:600;letter-spacing:-.025em}
.foot .r{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.foot .cr{font-size:11px;color:var(--faint);letter-spacing:.05em}

.an{animation:up .85s cubic-bezier(.22,.68,.24,1) both}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}
@media (max-width:560px){
  .soc{grid-template-columns:52px minmax(0,1fr);padding:18px}
  .mark{width:52px;height:52px;border-radius:12px}
  .desc{font-size:14.5px}
}
</style>

</head>
<body>
<div class="amb" aria-hidden="true"></div>

<div class="col">

  <a class="back an" href="links.html"><span aria-hidden="true">←</span> Voltar</a>

  <div class="eyebrow an" style="animation-delay:.06s">Sociedades</div>
  <h1 class="an" style="animation-delay:.1s">Minhas sociedades</h1>
  <p class="intro an" style="animation-delay:.16s" id="intro"></p>

  <div class="list" id="lista"></div>

  <!-- Depois de preencher as três sociedades, apague o bloco abaixo -->
  <div class="nota an" style="animation-delay:.5s">
    <b>Esboço</b>
    <p>Os textos desta página estão no início do código, na lista chamada SOCIEDADES. Troque o conteúdo entre aspas e a página se atualiza sozinha. Uma sociedade sem nome preenchido não aparece.</p>
  </div>

  <footer class="foot an" style="animation-delay:.56s">
    <div>
      <div class="n">Israel Santiago</div>
      <div class="r">Head de Operações &amp; PMO</div>
    </div>
    <span class="cr">© 2026 Israel Santiago</span>
  </footer>
</div>

<script>
/* ================================================================
   AQUI É O ÚNICO LUGAR QUE VOCÊ PRECISA EDITAR

   Uma sociedade sem nome preenchido não aparece na página.
   Campos que você deixar vazios simplesmente somem do cartão.

   nome      nome do negócio
   papel     sua posição, por exemplo Sócio, Sócio fundador
   segmento  a área de atuação
   desde     ano de entrada ou de fundação
   local     cidade e estado
   descricao uma ou duas frases sobre o negócio e o seu papel nele
   site      endereço completo, com https. Vazio esconde o link
   logo      nome do arquivo de imagem na mesma pasta, por exemplo logo1.png
             Vazio mostra a inicial do nome
   ================================================================ */

const INTRO = 'Além da minha atuação em operações e projetos, participo como sócio em negócios onde ajudo a estruturar a gestão, os processos e o crescimento.';

const SOCIEDADES = [

  { nome:'Atria Saúde',
    papel:'Sócio Co-Fundador',
    segmento:'Saúde',
    desde:'2026',
    local:'Rio de Janeiro, RJ',
    descricao:'Programa de acompanhamento médico contínuo para quem quer ter o controle da própria saúde.',
    site:'https://www.atriabrsaude.com.br',
    logo:'' },

  { nome:'Momentto Rio',
    papel:'Sócio',
    segmento:'Produtora Audiovisual',
    desde:'2025',
    local:'Rio de Janeiro, RJ',
    descricao:'Escreva aqui, em uma ou duas frases, o que o negócio faz e qual é o seu papel dentro dele.',
    site:'',
    logo:'' },

  { nome:'Nome da terceira sociedade',
    papel:'Sócio',
    segmento:'Segmento de atuação',
    desde:'2026',
    local:'Cidade, UF',
    descricao:'Escreva aqui, em uma ou duas frases, o que o negócio faz e qual é o seu papel dentro dele.',
    site:'',
    logo:'' },
];

/* ================================================================
   Daqui para baixo não precisa mexer
   ================================================================ */
(function(){
  const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const tem = v => v && String(v).trim();

  document.getElementById('intro').textContent = INTRO;

  const itens = SOCIEDADES.filter(s => s && tem(s.nome));
  let atraso = 0.2;

  document.getElementById('lista').innerHTML = itens.map(s => {
    atraso += 0.08;
    const inicial = s.nome.trim().charAt(0).toUpperCase();
    const marca = tem(s.logo)
      ? '<img src="' + esc(s.logo) + '" alt="' + esc(s.nome) + '">'
      : '<span class="letra">' + esc(inicial) + '</span>';

    const chips = [s.segmento, s.desde ? 'Desde ' + s.desde : '', s.local]
      .filter(tem).map(c => '<span class="chip">' + esc(c) + '</span>').join('');

    const link = tem(s.site)
      ? '<a class="acao" href="' + esc(s.site) + '" target="_blank" rel="noopener">Visitar site <span aria-hidden="true">↗</span></a>'
      : '';

    return '<article class="soc an" style="animation-delay:' + atraso.toFixed(2) + 's">' +
             '<div class="mark">' + marca + '</div>' +
             '<div class="corpo">' +
               '<div class="linha1"><h2 class="nome">' + esc(s.nome) + '</h2>' +
                 (tem(s.papel) ? '<span class="papel">' + esc(s.papel) + '</span>' : '') +
               '</div>' +
               (chips ? '<div class="meta">' + chips + '</div>' : '') +
               (tem(s.descricao) ? '<p class="desc">' + esc(s.descricao) + '</p>' : '') +
               link +
             '</div>' +
           '</article>';
  }).join('');
})();
</script>

</body>
</html>
